services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eurofans_chart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_USER: ${DB_USERNAME:-eurofans_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eurofans_chart"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/eurofans_chart
      DB_USERNAME: ${DB_USERNAME:-eurofans_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      DEPLOYMENT_BINDING_ENABLED: ${DEPLOYMENT_BINDING_ENABLED:-true}
      AUTHORIZED_GROUP_CHAT_ID: ${AUTHORIZED_GROUP_CHAT_ID:-}
      DEPLOYMENT_BINDING_FILE: ${DEPLOYMENT_BINDING_FILE:-file:/run/secrets/deployment-binding.json}
      DEPLOYMENT_BINDING_PUBLIC_KEY: ${DEPLOYMENT_BINDING_PUBLIC_KEY:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      APPLE_MUSIC_TEAM_ID: ${APPLE_MUSIC_TEAM_ID:-}
      APPLE_MUSIC_KEY_ID: ${APPLE_MUSIC_KEY_ID:-}
      APPLE_MUSIC_PRIVATE_KEY: ${APPLE_MUSIC_PRIVATE_KEY:-}
      APPLE_MUSIC_REDIRECT_ORIGIN: ${APPLE_MUSIC_REDIRECT_ORIGIN:-}
      SOUNDCLOUD_CLIENT_ID: ${SOUNDCLOUD_CLIENT_ID:-}
      SOUNDCLOUD_CLIENT_SECRET: ${SOUNDCLOUD_CLIENT_SECRET:-}
      SOUNDCLOUD_REDIRECT_URI: ${SOUNDCLOUD_REDIRECT_URI:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      CHART_STUDIO_USERNAME: ${CHART_STUDIO_USERNAME:?set CHART_STUDIO_USERNAME}
      CHART_STUDIO_PASSWORD: ${CHART_STUDIO_PASSWORD:?set CHART_STUDIO_PASSWORD}
    volumes:
      - ./deployment-binding.json:/run/secrets/deployment-binding.json:ro
    networks:
      - internal
    ports:
      - "8080:8080"

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
