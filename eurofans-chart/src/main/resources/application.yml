spring:
  application:
    name: eurofans-chart

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eurofans_chart}
    username: ${DB_USERNAME:eurofans_app}
    password: ${DB_PASSWORD:changeme}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.eurovision.analytics: INFO

# --- Application-specific configuration -------------------------------------

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:}

deployment:
  binding-enabled: ${DEPLOYMENT_BINDING_ENABLED:true}
  authorized-group-chat-id: ${AUTHORIZED_GROUP_CHAT_ID:}
  binding-file-path: ${DEPLOYMENT_BINDING_FILE:classpath:deployment-binding.json}
  signing-public-key: ${DEPLOYMENT_BINDING_PUBLIC_KEY:}
  application-identifier: eurovision-analytics-platform
  environment: ${DEPLOYMENT_ENVIRONMENT:production}

admin:
  telegram-ids: ${ADMIN_TELEGRAM_IDS:}

security:
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}

app:
  public-base-url: ${PUBLIC_BASE_URL:}

chart-studio:
  username: ${CHART_STUDIO_USERNAME:}
  password: ${CHART_STUDIO_PASSWORD:}

providers:
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    redirect-uri: ${SPOTIFY_REDIRECT_URI:}
  apple-music:
    team-id: ${APPLE_MUSIC_TEAM_ID:}
    key-id: ${APPLE_MUSIC_KEY_ID:}
    private-key: ${APPLE_MUSIC_PRIVATE_KEY:}
    redirect-origin: ${APPLE_MUSIC_REDIRECT_ORIGIN:}
  soundcloud:
    client-id: ${SOUNDCLOUD_CLIENT_ID:}
    client-secret: ${SOUNDCLOUD_CLIENT_SECRET:}
    redirect-uri: ${SOUNDCLOUD_REDIRECT_URI:}
  lastfm:
    api-key: ${LASTFM_API_KEY:}
