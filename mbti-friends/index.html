<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140f3d">
<meta name="description" content="Тип особистості MBTI очима друга та самооцінка: кімната з кодом, 91 питання, шкала від −3 до 3.">
<title>Дзеркало MBTI — тип очима друга</title>
<style>
:root{
  color-scheme:dark;
  --ink:#f6f7ff; --ink-2:rgba(236,239,255,.76); --ink-3:rgba(226,230,255,.62);
  --bg-a:#0d0b26; --bg-b:#1a1250; --bg-c:#2b0f5c; --bg-d:#0e2748;
  --glass-top:rgba(255,255,255,.17); --glass-bot:rgba(255,255,255,.05);
  --rim:rgba(255,255,255,.38); --rim-dim:rgba(255,255,255,.09);
  --shadow:0 18px 50px rgba(5,3,25,.42);
  --track:rgba(255,255,255,.11); --track-edge:rgba(0,0,0,.28);
  --orb-o:.78;
  --accent:#8b7bff; --accent-2:#35d3ff;
  --g1:#ff8bd0; --g2:#9d8bff; --g3:#4fe3ff;
  --neg:#ff6aa8; --pos:#3be0b4; --neu:#b9bcdc;
  --ok:#4ade80; --warn:#ffb340; --err:#ff7a9c;
  --r-lg:30px; --r-md:22px;
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --ink:#171540; --ink-2:rgba(23,21,64,.76); --ink-3:rgba(23,21,64,.54);
    --bg-a:#d9e3ff; --bg-b:#efdcff; --bg-c:#ffdfee; --bg-d:#d3f1ff;
    --glass-top:rgba(255,255,255,.68); --glass-bot:rgba(255,255,255,.26);
    --rim:rgba(255,255,255,.98); --rim-dim:rgba(255,255,255,.45);
    --shadow:0 18px 50px rgba(72,60,150,.20);
    --track:rgba(30,30,100,.10); --track-edge:rgba(30,30,100,.12);
    --orb-o:.62;
    --neu:#7d80a8;
    --g1:#d42f94; --g2:#6446ee; --g3:#0a86d6;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--bg-b)}
body{
  min-height:100vh;min-height:100dvh;
  font:16px/1.5 "SF Pro Display",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(155deg,var(--bg-a),var(--bg-b) 38%,var(--bg-c) 68%,var(--bg-d)) fixed;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
h1,h2,h3{line-height:1.12;letter-spacing:-.02em}
.orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;filter:blur(46px);opacity:var(--orb-o);animation:drift 28s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:52vmax;height:52vmax;left:-16vmax;top:-18vmax;background:radial-gradient(circle at 30% 30%,#ff5fa2,#7a3cff 72%)}
.orbs i:nth-child(2){width:42vmax;height:42vmax;right:-14vmax;top:8vh;background:radial-gradient(circle at 60% 40%,#35d3ff,#4a5cff 70%);animation-duration:34s;animation-delay:-8s}
.orbs i:nth-child(3){width:38vmax;height:38vmax;left:12vw;bottom:-18vmax;background:radial-gradient(circle at 40% 40%,#ffb340,#ff5f7a 72%);animation-duration:31s;animation-delay:-14s}
.orbs i:nth-child(4){width:30vmax;height:30vmax;right:6vw;bottom:-10vmax;background:radial-gradient(circle at 50% 50%,#3be0b4,#2c7bff 75%);animation-duration:38s;animation-delay:-20s}
@keyframes drift{to{transform:translate3d(7vmax,5vmax,0) scale(1.14)}}

#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 16px max(34px,env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap.wide{max-width:1040px}
.center{text-align:center}

/* ───────── liquid glass ───────── */
.glass{
  position:relative;isolation:isolate;border-radius:var(--r-lg);
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));
  -webkit-backdrop-filter:blur(26px) saturate(1.8) brightness(1.06);
  backdrop-filter:blur(26px) saturate(1.8) brightness(1.06);
  box-shadow:var(--shadow),inset 0 1.5px 0 var(--rim),inset 0 -1.5px 0 var(--rim-dim),inset 1.5px 0 0 var(--rim-dim),inset 0 0 30px rgba(255,255,255,.06);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:conic-gradient(from 215deg at 50% 50%,rgba(255,255,255,.8),rgba(255,255,255,0) 17%,rgba(110,205,255,.38) 38%,rgba(255,255,255,0) 55%,rgba(255,120,205,.38) 76%,rgba(255,255,255,.75));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.glass::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(380px circle at var(--mx,20%) var(--my,0%),rgba(255,255,255,.22),transparent 60%);
  transition:opacity .4s;
}
.card{padding:22px}
.card.tight{padding:16px 18px}
.card h2{font-size:1.15rem;margin-bottom:4px}
.card .sub{color:var(--ink-2);font-size:.92rem}

/* ───────── controls ───────── */
.btn{
  appearance:none;border:0;cursor:pointer;font-weight:620;letter-spacing:-.005em;
  padding:.82em 1.35em;border-radius:999px;position:relative;isolation:isolate;
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));
  -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
  box-shadow:0 8px 22px rgba(5,3,25,.26),inset 0 1.5px 0 var(--rim),inset 0 -1.5px 0 var(--rim-dim);
  transition:transform .28s cubic-bezier(.3,1.7,.5,1),box-shadow .25s,filter .25s,opacity .25s;
}
.btn:hover{transform:translateY(-1px) scale(1.025)}
.btn:active{transform:scale(.965)}
.btn:focus-visible,.pt:focus-visible,.role:focus-visible,.seg button:focus-visible,.input:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
.btn.primary{color:#fff;text-shadow:0 1px 10px rgba(25,8,80,.45);background:linear-gradient(140deg,rgba(139,123,255,.92),rgba(53,211,255,.78))}
.btn.big{font-size:1.08rem;padding:1em 1.6em;width:100%}
.btn.ghost{background:linear-gradient(140deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 var(--rim-dim),inset 0 -1px 0 var(--rim-dim)}
.btn.small{padding:.5em 1em;font-size:.88rem}
.btn[disabled]{opacity:.42;pointer-events:none;filter:saturate(.6)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.grow>*{flex:1 1 0}
.row.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.input{
  width:100%;padding:.85em 1.1em;border-radius:18px;border:0;outline:none;
  background:rgba(255,255,255,.08);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.28),inset 0 -1px 0 var(--rim-dim),0 0 0 1px rgba(255,255,255,.1);
  transition:box-shadow .2s;
}
.input::placeholder{color:var(--ink-3)}
.input:focus{box-shadow:inset 0 2px 8px rgba(0,0,0,.28),0 0 0 2px var(--accent-2)}
.row>.input{min-width:0}
.input.code{text-align:center;font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:1.15rem}
.chip{display:inline-flex;align-items:center;gap:7px;padding:.32em .8em;border-radius:999px;font-size:.82rem;font-weight:600;
  background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 var(--rim-dim),0 0 0 1px rgba(255,255,255,.08);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--neu);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.wait{background:var(--warn);animation:pulse 1.3s infinite}
.dot.off{background:var(--err)}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 2px 6px rgba(0,0,0,.22)}
.seg button{flex:1;border:0;background:none;cursor:pointer;padding:.55em .9em;border-radius:999px;font-weight:600;color:var(--ink-2);transition:all .3s cubic-bezier(.3,1.5,.5,1)}
.seg button.on{color:var(--ink);background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));box-shadow:0 4px 14px rgba(5,3,25,.28),inset 0 1.5px 0 var(--rim)}
.muted{color:var(--ink-2)} .fine{color:var(--ink-3);font-size:.8rem;line-height:1.45}
.err{color:var(--err);font-size:.9rem;min-height:1.2em}
.grad{background:linear-gradient(100deg,var(--g1),var(--g2) 45%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rim-dim),transparent)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ───────── home ───────── */
.logo{width:96px;height:96px;margin:6px auto 2px;position:relative}
.logo i{position:absolute;width:62px;height:62px;border-radius:50%;
  background:linear-gradient(140deg,rgba(255,255,255,.42),rgba(255,255,255,.08));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -2px 8px rgba(255,255,255,.18),0 10px 28px rgba(10,5,50,.4);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.logo i:first-child{left:0;top:6px;background:linear-gradient(140deg,rgba(255,120,200,.7),rgba(255,255,255,.08))}
.logo i:last-child{right:0;bottom:6px;background:linear-gradient(140deg,rgba(80,220,255,.7),rgba(255,255,255,.08))}
h1.title{font-size:clamp(2.1rem,8vw,3rem);font-weight:780}
.lead{font-size:1.06rem;color:var(--ink-2);max-width:34em;margin:0 auto}
.steps{list-style:none;display:grid;gap:12px;padding:18px 20px;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:flex-start;text-align:left;color:var(--ink-2);font-size:.95rem}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--ink);
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));box-shadow:inset 0 1px 0 var(--rim),0 4px 10px rgba(5,3,25,.25)}
.steps b{color:var(--ink)}
.resume{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;text-align:left}
.invite{border-radius:18px;padding:12px 14px;background:rgba(59,224,180,.14);box-shadow:inset 0 0 0 1px rgba(59,224,180,.35);color:var(--ink);text-align:left;font-size:.95rem}

/* ───────── lobby ───────── */
.code-box{text-align:center;padding:24px 20px}
.code-big{font-size:clamp(2.2rem,11vw,3.6rem);font-weight:800;letter-spacing:.16em;margin:6px 0 12px;padding-left:.16em;font-variant-numeric:tabular-nums}
.people{display:grid;gap:10px}
.person{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 var(--rim-dim),0 0 0 1px rgba(255,255,255,.06)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:750;flex:none;color:#fff;
  background:linear-gradient(140deg,#9d8bff,#35d3ff);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 6px 16px rgba(5,3,25,.3)}
.avatar.ghost{background:rgba(255,255,255,.08);color:var(--ink-3);box-shadow:none;border:1.5px dashed rgba(255,255,255,.3)}
.person .who{flex:1;min-width:0}
.person .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .who small{color:var(--ink-3)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{appearance:none;border:0;text-align:left;cursor:pointer;padding:18px 16px;border-radius:24px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));
  box-shadow:0 8px 24px rgba(5,3,25,.25),inset 0 1.5px 0 var(--rim),inset 0 -1.5px 0 var(--rim-dim);
  transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s,background .3s}
.role:hover{transform:translateY(-2px)}
.role .em{font-size:1.9rem;line-height:1}
.role b{font-size:1.02rem}
.role span{color:var(--ink-2);font-size:.84rem;line-height:1.35}
.role.on{background:linear-gradient(140deg,rgba(139,123,255,.6),rgba(53,211,255,.38));box-shadow:0 10px 30px rgba(80,70,220,.4),inset 0 1.5px 0 rgba(255,255,255,.7),0 0 0 2px rgba(255,255,255,.55)}
.role[disabled]{opacity:.4;pointer-events:none}
.warn{border-radius:18px;padding:12px 14px;background:rgba(255,179,64,.16);box-shadow:inset 0 0 0 1px rgba(255,179,64,.4);font-size:.92rem}
.warn.bad{background:rgba(255,122,156,.16);box-shadow:inset 0 0 0 1px rgba(255,122,156,.45)}

/* ───────── quiz ───────── */
.progress{height:10px;border-radius:99px;background:var(--track);box-shadow:inset 0 1px 3px var(--track-edge);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:inherit;width:var(--v,0%);transition:width .5s cubic-bezier(.2,.9,.3,1);
  background:linear-gradient(90deg,#ff8bd0,#9d8bff,#4fe3ff);box-shadow:0 0 14px rgba(157,139,255,.7)}
.qcard{padding:26px 22px 24px;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;gap:22px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink-3);font-size:.85rem}
.qtext{font-size:clamp(1.28rem,4.6vw,1.8rem);font-weight:660;line-height:1.28;letter-spacing:-.012em;text-wrap:balance}
.qanim{animation:qin .38s cubic-bezier(.2,.9,.3,1)}
@keyframes qin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.qanim.back{animation-name:qinb}
@keyframes qinb{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(2px,1.2vw,10px);align-items:center;justify-items:center}
.pt{appearance:none;border:0;cursor:pointer;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;
  font-weight:700;font-size:clamp(.72rem,2.6vw,.95rem);color:var(--ink-2);--c:var(--neu);
  background:linear-gradient(140deg,var(--glass-top),var(--glass-bot));
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent),inset 0 2px 0 var(--rim),0 6px 16px rgba(5,3,25,.25);
  transition:transform .3s cubic-bezier(.3,1.8,.5,1),box-shadow .3s,background .3s,color .2s}
.pt:hover{transform:scale(1.1)}
.pt:active{transform:scale(.92)}
.pt.neg{--c:var(--neg)} .pt.pos{--c:var(--pos)}
.pt[data-s="3"],.pt[data-s="-3"]{width:100%}
.pt[data-s="2"],.pt[data-s="-2"]{width:84%}
.pt[data-s="1"],.pt[data-s="-1"]{width:70%}
.pt[data-s="0"]{width:58%}
.pt.sel{color:#fff;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 95%,#fff),color-mix(in srgb,var(--c) 70%,#000));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 8px rgba(0,0,0,.18),0 0 0 3px rgba(255,255,255,.55),0 8px 26px color-mix(in srgb,var(--c) 75%,transparent);transform:scale(1.08)}
.scale-cap{display:flex;justify-content:space-between;color:var(--ink-3);font-size:.78rem;margin-top:8px;padding:0 2px}
.scale-cap b{font-weight:600}
.hint{display:none}
@media (hover:hover){.hint{display:block;text-align:center}}

/* ───────── result ───────── */
.rv{opacity:0;transform:translateY(20px) scale(.985);transition:opacity .7s ease var(--d,0ms),transform .8s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.col{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.grid>*{grid-column:span 12;min-width:0}
@media (min-width:900px){.span6{grid-column:span 6}.span7{grid-column:span 7}.span5{grid-column:span 5}.span8{grid-column:span 8}.span4{grid-column:span 4}}
.hero{padding:28px 22px 24px;text-align:center;overflow:hidden;--ac:#9d8bff}
.hero .glow{position:absolute;inset:-30% -10% auto -10%;height:80%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 55%,transparent),transparent);filter:blur(30px);opacity:.8}
.eyebrow{font-size:.82rem;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-2);font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.85fr);gap:10px;margin:18px auto 12px;max-width:560px}
.tile{min-width:0;padding:12px 2px 10px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:0;--c1:#fff;--c2:#fff}
.tile .l{font-size:clamp(2.6rem,12vw,4.6rem);font-weight:820;line-height:1.05;background:linear-gradient(160deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--c2) 55%,transparent))}
.tile small{font-size:clamp(.52rem,2.2vw,.7rem);color:var(--ink-2);margin-top:-2px;max-width:100%;text-align:center}
.tile em{font-style:normal;font-size:.8rem;font-weight:700;margin-top:2px}
.tile.sfx{justify-content:center;padding:12px 2px}
.tile.sfx .l{font-size:clamp(1.6rem,6vw,2.4rem)}
.tname{font-size:clamp(1.7rem,6.5vw,2.6rem);font-weight:790}
.tagline{color:var(--ink-2);max-width:32em;margin:6px auto 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.view{padding:10px 8px;border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 var(--rim-dim);text-align:center}
.view small{display:block;color:var(--ink-3);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.view b{font-size:clamp(.82rem,4vw,1.05rem);white-space:nowrap}
.view.cur{background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,.07));box-shadow:inset 0 1.5px 0 var(--rim),0 0 0 1.5px rgba(255,255,255,.4)}
.slider-box{padding:18px 20px}
.range{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;margin:14px 0 8px;background:linear-gradient(90deg,#ff8bd0,#9d8bff,#4fe3ff);box-shadow:inset 0 1px 3px var(--track-edge);outline:none}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;cursor:grab;background:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,.55));box-shadow:0 4px 14px rgba(5,3,25,.5),inset 0 2px 0 #fff,0 0 0 3px rgba(255,255,255,.35)}
.range::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;cursor:grab;background:linear-gradient(140deg,#fff,rgba(255,255,255,.55));box-shadow:0 4px 14px rgba(5,3,25,.5)}
.range:focus-visible{outline:2px solid var(--accent-2);outline-offset:4px}
.range-cap{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-2)}

.axis{padding:18px 20px 16px}
.axis-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;font-size:.92rem}
.axis-top .pole{color:var(--ink-3);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.axis-top .pole.b{justify-content:flex-end;text-align:right}
.axis-top .pole.dom{color:var(--ink)}
.axis-top .pole b{font-size:1.15rem;font-weight:800}
.axis-top .pole em{font-style:normal;font-weight:750}
.axis-head{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2);font-weight:650;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.split{position:relative;height:18px;border-radius:99px;margin:26px 0 26px;background:var(--track);box-shadow:inset 0 2px 4px var(--track-edge),inset 0 -1px 0 var(--rim-dim)}
.split .fa,.split .fb{position:absolute;top:0;bottom:0;border-radius:99px;transition:width 1.2s cubic-bezier(.2,.9,.2,1) var(--d,0ms),left 1.2s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.split .fa{left:0;width:0;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 16px color-mix(in srgb,var(--c1) 60%,transparent),inset 0 1.5px 0 rgba(255,255,255,.55)}
.split .fb{right:0;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c2) 22%,transparent),color-mix(in srgb,var(--c2) 12%,transparent))}
.in .split .fa{width:var(--v)}
.in .split .fb{width:calc(100% - var(--v))}
.knob{position:absolute;top:50%;left:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,.5));
  box-shadow:0 6px 18px rgba(5,3,25,.5),inset 0 2px 0 #fff,inset 0 -3px 6px rgba(0,0,0,.12),0 0 0 3px color-mix(in srgb,var(--c1) 50%,transparent);
  transition:left 1.2s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.in .knob{left:var(--v)}
.mk{position:absolute;transform:translateX(-50%);font-size:.66rem;font-weight:750;letter-spacing:.02em;white-space:nowrap;padding:2px 7px;border-radius:99px;
  background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 var(--rim-dim),0 0 0 1px rgba(255,255,255,.16);transition:left 1.2s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.mk.s{top:-26px;left:0}.mk.f{bottom:-26px;left:0}
.in .mk{left:var(--v)}
.mk::after{content:"";position:absolute;left:50%;margin-left:-3px;border:3px solid transparent}
.mk.s::after{top:100%;border-top-color:rgba(255,255,255,.5)}
.mk.f::after{bottom:100%;border-bottom-color:rgba(255,255,255,.5)}
.axis-note{color:var(--ink-2);font-size:.88rem}
.radar-wrap{display:grid;place-items:center;padding:6px 0 0}
.radar-wrap svg{width:100%;max-width:380px;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:.8rem;color:var(--ink-2);margin-top:8px}

.facets{display:grid;gap:18px}
.fgroup h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2);margin-bottom:10px;display:flex;align-items:center;gap:8px}

.facet .a{text-align:right}
.facet .dom{color:var(--ink);font-weight:650}
.fbar{position:relative;height:10px;border-radius:99px;background:var(--track);box-shadow:inset 0 1px 3px var(--track-edge)}
.fbar>i{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width 1.1s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.in .fbar>i{width:var(--v)}
.fbar>b{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(5,3,25,.5);transition:left 1.1s cubic-bezier(.2,.9,.2,1) var(--d,0ms)}
.in .fbar>b{left:var(--v)}
.fname{grid-column:1/-1;text-align:center;font-size:.78rem;color:var(--ink-2);margin-bottom:-2px}
.ring-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--c1) calc(var(--v)*1%),var(--track) 0);

.ring b{font-size:1.7rem;font-weight:800}
.ring small{display:block;font-size:.66rem;color:var(--ink-3);margin-top:-6px;text-align:center}
.ring-txt{flex:1;min-width:180px}
.gap-list{display:grid;gap:10px;margin-top:14px}
.gap{padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.07);font-size:.88rem;color:var(--ink-2);box-shadow:inset 0 1px 0 var(--rim-dim)}

.stack4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.fn b{font-size:.84rem;display:block}

.lists{display:grid;gap:14px}

.lists h3{font-size:.95rem;margin-bottom:8px}

.lists li{padding-left:22px;position:relative;font-size:.92rem;color:var(--ink-2)}
.lists li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.lists .bad li::before{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.para{color:var(--ink-2);font-size:.98rem}
.alts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ───────── questions list ───────── */
.qlist{display:grid;gap:10px}
.qrow{display:grid;grid-template-columns:34px 1fr;gap:6px 12px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.06);font-size:.9rem;box-shadow:inset 0 1px 0 var(--rim-dim)}
.qrow .n{font-weight:750;color:var(--ink-3)}
.qrow .f{font-weight:600}
.qrow .s{color:var(--ink-2);grid-column:2}
.qrow .tag{grid-column:2;font-size:.72rem;color:var(--ink-3)}
.qhead{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2);font-weight:700;margin:14px 2px 2px}

.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;z-index:50;padding:.7em 1.3em;border-radius:999px;font-weight:600;font-size:.92rem;pointer-events:none;transition:all .4s cubic-bezier(.2,.9,.3,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:rot .9s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
@media (max-width:420px){
  .card{padding:18px 16px}
  .roles{grid-template-columns:1fr}
  .facet{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,.9fr);font-size:.76rem}
  .tiles{gap:6px}
  .hero{padding:24px 12px 20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}

<script>
/* ═════════════ ДАНІ ═════════════

const AXES = [

    c1:'#4ade80', c2:'#22c1a8' },
];
const AXIS = Object.fromEntries(AXES.map(a => [a.id, a]));

const FACETS = [
  { id:'ei1', axis:'EI', name:'Джерело енергії', a:'від людей', b:'на самоті', q:[
    [ 1, 'Після гучної вечірки {s} відчуває приплив сил, а не втому.', 'Після гучної вечірки я відчуваю приплив сил, а не втому.'],
    [-1, 'Після тривалого спілкування {d} потрібно побути на самоті, щоб відновитися.', 'Після тривалого спілкування мені потрібно побути на самоті, щоб відновитися.'],
    [ 1, '{S} краще думає, коли проговорює свої думки вголос з іншими.', 'Я краще думаю, коли проговорюю свої думки вголос з іншими.'],
    [-1, 'Ідеальний вечір для {n} — тиша вдома на самоті або з однією-двома близькими людьми.', 'Ідеальний вечір для мене — тиша вдома на самоті або з однією-двома близькими людьми.'],
    [ 1, 'У великій компанії {s} почувається як риба у воді.', 'У великій компанії я почуваюсь як риба у воді.'],
  ]},
  { id:'ei2', axis:'EI', name:'Експресивність', a:'виразний', b:'стриманий', q:[

    [-1, '{S} говорить мало, якщо тема не здається {d} справді важливою.', 'Я говорю мало, якщо тема не здається мені справді важливою.'],
    [ 1, '{S} охоче розповідає про свої справи й почуття навіть малознайомим людям.', 'Я охоче розповідаю про свої справи й почуття навіть малознайомим людям.'],
    [-1, 'Щоб по-справжньому пізнати {g}, потрібен час: {s} відкривається не одразу.', 'Щоб мене по-справжньому пізнати, потрібен час: я відкриваюсь не одразу.'],
    [-1, 'На людях {s} зазвичай стримано виявляє емоції.', 'На людях я зазвичай стримано виявляю емоції.'],

  { id:'ei3', axis:'EI', name:'Коло спілкування', a:'широке', b:'вузьке', q:[

    [-1, '{S} має кілька справді близьких людей і не прагне розширювати коло спілкування.', 'Я маю кількох справді близьких людей і не прагну розширювати коло спілкування.'],
    [ 1, 'Зазвичай саме від {n} виходить ініціатива зібратися, зустрітися чи кудись поїхати.', 'Зазвичай саме від мене виходить ініціатива зібратися, зустрітися чи кудись поїхати.'],

  ]},
  { id:'ei4', axis:'EI', name:'Увага', a:'на сцені', b:'за лаштунками', q:[

    [-1, 'Публічні виступи й пильна увага викликають у {n} радше напругу, ніж азарт.', 'Публічні виступи й пильна увага викликають у мене радше напругу, ніж азарт.'],
    [-1, '{S} краще почувається за лаштунками, ніж на сцені.', 'Я краще почуваюсь за лаштунками, ніж на сцені.'],

  { id:'sn1', axis:'SN', name:'Тип мислення', a:'конкретне', b:'абстрактне', q:[

    [-1, '{S} із захопленням міркує про абстрактні ідеї: сенс життя, майбутнє, «а що, якби…».', 'Я із захопленням міркую про абстрактні ідеї: сенс життя, майбутнє, «а що, якби…».'],
    [ 1, '{S} довіряє тому, що можна побачити, помацати й перевірити.', 'Я довіряю тому, що можна побачити, помацати й перевірити.'],
    [-1, '{S} помічає зв’язки між, здавалося б, непов’язаними речами й читає «між рядків».', 'Я помічаю зв’язки між, здавалося б, непов’язаними речами й читаю «між рядків».'],

  { id:'sn2', axis:'SN', name:'Підхід', a:'практичний', b:'уявний', q:[

    [ 1, '{S} стоїть на землі: краще синиця в руці, ніж журавель у небі.', 'Я стою на землі: краще синиця в руці, ніж журавель у небі.'],

// Стабільний «перемішаний» порядок: осі чергуються, але в однаковому порядку в обох учасників.
const ORDER = (() => {
  let seed = 20241017;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const byAxis = {};
  QUESTIONS.forEach(q => { (byAxis[q.axis] = byAxis[q.axis] || []).push(q.id); });
  const keyed = [];
  Object.keys(byAxis).forEach(ax => {
    const arr = byAxis[ax];
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    arr.forEach((qi, pos) => keyed.push([(pos + 0.5) / arr.length + (rnd() - 0.5) * 0.03, qi]));
  });
  keyed.sort((x, y) => x[0] - y[0]);
  return keyed.map(k => k[1]);
})();

function score(ans) {
  const ax = {}, fc = {};
  AXES.forEach(a => ax[a.id] = { sum: 0, n: 0 });
  FACETS.forEach(f => fc[f.id] = { sum: 0, n: 0 });
  QUESTIONS.forEach((q, i) => {
    const v = ans[i]; if (v == null) return;
    ax[q.axis].sum += v * q.key; ax[q.axis].n++;
    fc[q.facet].sum += v * q.key; fc[q.facet].n++;
  });
  const out = { ax: {}, fc: {} };
  for (const k in ax) out.ax[k] = ax[k].n ? ax[k].sum / (3 * ax[k].n) : 0;
  for (const k in fc) out.fc[k] = fc[k].n ? fc[k].sum / (3 * fc[k].n) : 0;
  return out;
}
function blend(a, b, w) {
  const out = { ax: {}, fc: {} };
  for (const k in a.ax) out.ax[k] = a.ax[k] * (1 - w) + b.ax[k] * w;
  for (const k in a.fc) out.fc[k] = a.fc[k] * (1 - w) + b.fc[k] * w;
  return out;
}
const pctOf = s => Math.max(0, Math.min(100, Math.round(50 + 50 * s)));   // % до ПЕРШОГО полюса
function typeOf(sc) {
  let code = '';
  for (const ax of AXES.slice(0, 4)) code += sc.ax[ax.id] > 0 ? ax.a.k : ax.b.k;
  const id = sc.ax.AT > 0 ? 'A' : 'T';
  return { code, id, full: code + '-' + id };
}
function pole(ax, s) {            // домінантний полюс і його %
  const first = s > 0, p = pctOf(s);
  return { p: ax[first ? 'a' : 'b'], pct: first ? p : 100 - p, first };
}
function altTypes(sc) {
  const base = typeOf(sc).code.split('');
  return AXES.slice(0, 4).map((ax, i) => ({ i, ax, d: Math.abs(sc.ax[ax.id]) }))
    .filter(o => o.d < 0.2).sort((x, y) => x.d - y.d).slice(0, 2)
    .map(o => { const c = base.slice(); c[o.i] = sc.ax[o.ax.id] > 0 ? o.ax.b.k : o.ax.a.k; return c.join(''); });
}
function computeResult(w) {

}

/* ═════════════ КІМНАТА (релей на ntfy.sh: HTTP + SSE, без бекенда) ═════════════
   Кожен учасник публікує у тему «знімок стану» (ім’я, роль, відповіді). Повідомлення
   зберігаються на релеї ~12 год, тож стан відновлюється після перезавантаження,
   а друг може пройти тест пізніше. Місця в кімнаті — перші два автори. */
const net = { es: null, st: 'idle', code: null, intent: null, seats: [], states: {}, ready: false, decided: false, full: false,
              dirty: false, backoff: 0, decideT: 0, flushT: 0, openT: 0 };

function setNet(st) {
  if (net.st === st) return;
  net.st = st; refreshDynamic();
}
function netClose() {
  if (net.es) { net.es.onopen = net.es.onerror = net.es.onmessage = null; net.es.close(); }
  clearTimeout(net.decideT); clearTimeout(net.flushT); clearTimeout(net.openT);
  Object.assign(net, { es: null, st: 'idle', code: null, seats: [], states: {}, ready: false, decided: false, full: false, dirty: false, backoff: 0 });
}
function netConnect(code, intent) {
  netClose();
  net.code = code; net.intent = intent; net.st = 'connecting';
  let es;
  try { es = new EventSource(`${RELAY}/${TOPIC(code)}/sse?since=all`); }
  catch (e) { net.st = 'offline'; return; }
  net.es = es;
  net.openT = setTimeout(() => { if (net.es === es && net.st === 'connecting') setNet('offline'); }, 12000);
  es.onopen = () => { clearTimeout(net.openT); setNet('online'); armDecide(); if (net.ready && net.dirty) flush(); };
  es.onerror = () => { if (net.es === es) setNet(es.readyState === 2 ? 'offline' : 'connecting'); };
  es.onmessage = onRelayMessage;
}
const others = () => net.seats.filter(c => c !== S.cid);
function armDecide() {
  if (net.decided) return;
  clearTimeout(net.decideT);
  const n = others().length;
  const ms = net.intent === 'join' ? (n ? 350 : 4500) : net.intent === 'create' ? 1300 : 1600;
  net.decideT = setTimeout(decide, ms);
}
function onRelayMessage(ev) {
  let env, m;
  try { env = JSON.parse(ev.data); if (!env || env.event !== 'message') return; m = JSON.parse(env.message); } catch (e) { return; }
  if (!m || m.v !== 1 || m.t !== 'state' || typeof m.c !== 'string' || m.c.length > 40) return;
  if (!net.seats.includes(m.c)) net.seats.push(m.c);
  if (m.c !== S.cid) net.states[m.c] = m;
  if (!net.decided) armDecide();
  syncPeer();
}
function syncPeer() {
  const o = others()[0];
  if (net.decided && net.full) return;
  if (!o) return;
  const next = decodePeer(net.states[o]);
  P = next;
  S.pcache = net.states[o]; save();
  onPeerChange();
}
function decide() {
  net.decided = true;
  const n = others().length, mine = net.seats.includes(S.cid);
  if (!mine && n >= 2) {              // третя людина — кімната вже зайнята
    net.full = true; P = null; netClose(); homeErr = 'У цій кімнаті вже двоє учасників.';
    S.mode = null; S.code = null; save(); go('home'); return;
  }
  if (net.intent === 'create' && !mine && n >= 1) {   // код уже зайнятий — беремо інший
    S.code = rid(CODE_LEN); save(); P = null; netConnect(S.code, 'create'); refreshDynamic(); return;
  }
  if (net.intent === 'join' && !mine && n === 0) {
    netClose(); homeErr = 'Кімнату з таким кодом не знайдено. Перевір код — або вона старша за 12 годин.';
    S.mode = null; S.code = null; save(); go('home'); return;
  }
  net.ready = true; net.dirty = true; flush(); refreshDynamic();
}
function snapshot() {
  const r = S.role;
  return { v: 1, t: 'state', c: S.cid, n: S.name.slice(0, 24), r, p: S.pron, a: r ? enc(S.ans[r]) : '', d: r && S.done[r] ? 1 : 0 };
}
function netPush(delay) {
  if (S.mode !== 'room' || !net.code) return;
  net.dirty = true; clearTimeout(net.flushT); net.flushT = setTimeout(flush, delay || 0);
}
async function flush() {
  if (!net.dirty || !net.ready || !net.code) return;
  const code = net.code;
  net.dirty = false;
  try {
    const r = await fetch(`${RELAY}/${TOPIC(code)}`, { method: 'POST', body: JSON.stringify(snapshot()) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    net.backoff = 0;
  } catch (e) {
    if (net.code !== code) return;
    net.dirty = true; net.backoff = Math.min(30000, (net.backoff || 2000) * 2);
    clearTimeout(net.flushT); net.flushT = setTimeout(flush, net.backoff);
  }
}
function reconnectIfNeeded() {

}

/* ───────── тест ───────── */
function startQuiz(role) {
  const ans = S.ans[role];
  let pos = ORDER.findIndex(qi => ans[qi] == null);
  if (pos < 0) pos = NQ - 1;
  Q = { role, pos, dir: 'f' };
  go('quiz');
}
function viewQuiz() {
  return `<section class="wrap">
    <div class="topbar"><button class="btn small ghost" data-act="exitQuiz">← Пауза</button><span class="chip" id="q-chip"></span></div>

    <div class="card glass qcard" id="q-card"></div>
    <div class="row spread"><button class="btn small ghost" data-act="prev" id="q-prev">← Назад</button><span class="fine hint">Клавіші 1–7 · ← назад</span></div>
  </section>`;
}
function paintQuiz(anim) {
  const card = $('q-card'); if (!card || !Q) return;
  const role = Q.role, qi = ORDER[Q.pos], q = QUESTIONS[qi];
  const pron = role === 'friend' ? (S.pron || 'any') : 'any';
  const text = role === 'self' ? q.self : fmt(q.friend, pron);
  const cur = S.ans[role][qi];
  const n = cnt(S.ans[role]);
  const tn = targetName();
  $('q-chip').textContent = role === 'self' ? '🪞 Про себе' : '🫶 Оцінюєш: ' + (tn || 'другого учасника');
  $('q-prog').style.setProperty('--v', (n / NQ * 100) + '%');
  $('q-prev').disabled = Q.pos === 0;
  const intro = n === 0 ? `<p class="fine" style="margin-top:10px">${role === 'self'
    ? '−3 — «зовсім не про мене», +3 — «точно про мене». Відповідай як є, а не як «правильно».'
    : fmt('−3 — «зовсім не про {n}», +3 — «точно про {n}». Дивись на те, як людина поводиться зазвичай.', pron)}</p>` : '';
  const scale = SCALE.map(v => `<button class="pt ${v < 0 ? 'neg' : v > 0 ? 'pos' : ''} ${cur === v ? 'sel' : ''}" data-act="ans" data-v="${v}" data-s="${v}" role="radio" aria-checked="${cur === v}" aria-label="${sgn(v)}">${sgn(v)}</button>`).join('');
  card.innerHTML = `<div class="${anim ? 'qanim' + (Q.dir === 'b' ? ' back' : '') : ''}" style="display:flex;flex-direction:column;gap:22px;flex:1;justify-content:space-between">
      <div><div class="qmeta"><span>Питання ${Q.pos + 1} з ${NQ}</span><span>${Math.round(n / NQ * 100)}%</span></div>
        <div class="qtext" style="margin-top:14px">${esc(nb(text))}</div>${intro}</div>
      <div><div class="scale" role="radiogroup" aria-label="Оцінка від −3 до +3">${scale}</div>
        <div class="scale-cap"><b>Зовсім ні</b><span>Нейтрально</span><b>Цілком так</b></div></div>
    </div>`;
}
function answer(v) {
  if (!Q) return;
  const role = Q.role, qi = ORDER[Q.pos];
  S.ans[role][qi] = v;
  const n = cnt(S.ans[role]);
  const finished = n === NQ;
  if (finished) S.done[role] = true;
  save();
  document.querySelectorAll('#q-card .pt').forEach(b => { const on = +b.dataset.v === v; b.classList.toggle('sel', on); b.setAttribute('aria-checked', on); });
  $('q-prog').style.setProperty('--v', (n / NQ * 100) + '%');
  if (S.mode === 'room') { if (finished || n % 13 === 0) netPush(0); else if (S.done[role]) netPush(1500); }
  const myQ = Q;
  setTimeout(() => {
    if (Q !== myQ || screen !== 'quiz') return;
    if (finished) return finishQuiz(role);
    if (Q.pos < NQ - 1) { Q.pos++; }
    else { const next = ORDER.findIndex(i => S.ans[role][i] == null); if (next >= 0) Q.pos = next; else return finishQuiz(role); }
    Q.dir = 'f'; paintQuiz(true);
  }, 260);
}
function finishQuiz(role) {
  S.done[role] = true; save();
  if (S.mode === 'local') {
    if (role === 'self') { S.turn = 'friend'; save(); go('pass'); } else go('result');
    return;
  }
  netPush(0);
  go(bothDone() ? 'result' : 'wait');
}

function controlsInner(w) {
  const R = computeResult(w);
  const cell = (label, t, val) => `<button class="view ${Math.abs(w - val) < 0.04 ? 'cur' : ''}" data-act="tab" data-v="${val}" style="appearance:none;border:0;cursor:pointer;color:inherit"><small>${label}</small><b>${t.full}</b></button>`;

}
function axisCard(ax, R, i) {
  const s = R.sc.ax[ax.id], p = pctOf(s), pS = pctOf(R.ss.ax[ax.id]), pF = pctOf(R.sf.ax[ax.id]);
  const domA = p > 50;
  const dp = domA ? p : 100 - p;
  const strength = dp < 55 ? 'майже порівну' : dp < 65 ? 'помірно' : dp < 78 ? 'виразно' : 'яскраво виражено';
  const dom = domA ? ax.a : ax.b;
  return `<div class="glass axis rv" style="--c1:${ax.c1};--c2:${ax.c2};--v:${p}%;--d:${i * 90}ms">
    <div class="axis-head"><span>${ax.title}</span><span style="text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:500">${ax.hint}</span></div>
    <div class="axis-top">
      <span class="pole a ${domA ? 'dom' : ''}"><b>${ax.a.k}</b>${ax.a.name}<em>${p}%</em></span>
      <span class="pole b ${domA ? '' : 'dom'}"><em>${100 - p}%</em>${ax.b.name}<b>${ax.b.k}</b></span>
    </div>
    <div class="split"><span class="fa"></span><span class="fb"></span>
      <span class="mk s" style="--v:${pS}%">я</span><span class="mk f" style="--v:${pF}%">друг</span>
      <span class="knob"></span></div>
    <div class="axis-note"><b style="color:var(--ink)">${dom.name}</b> — ${strength} (${dp}%). Самооцінка: ${pS}% ${ax.a.k}, друг: ${pF}% ${ax.a.k}.</div>
  </div>`;
}
function radarSVG(R) {
  const order = ['E', 'S', 'T', 'J', 'I', 'N', 'F', 'P'];
  const val = (sc, k) => { const ax = AXES.find(a => a.a.k === k || a.b.k === k); const p = pctOf(sc.ax[ax.id]); return ax.a.k === k ? p : 100 - p; };
  const col = k => AXES.find(a => a.a.k === k || a.b.k === k).c1;
  const cx = 190, cy = 190, Rr = 118;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * Math.PI / 4, r = Rr * v / 100; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const str = (arr) => arr.map(n => n.toFixed(1)).join(',');
  const poly = sc => order.map((k, i) => str(pt(i, val(sc, k)))).join(' ');
  const ring = v => order.map((_, i) => str(pt(i, v))).join(' ');
  const rings = [25, 50, 75, 100].map(v => `<polygon points="${ring(v)}" fill="none" stroke="currentColor" stroke-opacity="${v === 50 ? .28 : .13}" ${v === 50 ? '' : 'stroke-dasharray="3 5"'}/>`).join('');
  const spokes = order.map((_, i) => { const [x, y] = pt(i, 100); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="currentColor" stroke-opacity=".13"/>`; }).join('');
  const labels = order.map((k, i) => {
    const [x, y] = pt(i, 132), v = val(R.sc, k), dom = v >= 50;
    return `<text x="${x.toFixed(1)}" y="${(y - 2).toFixed(1)}" text-anchor="middle" fill="${col(k)}" opacity="${dom ? 1 : .6}"><tspan font-size="18" font-weight="800">${k}</tspan><tspan x="${x.toFixed(1)}" dy="14" font-size="11" fill="currentColor" font-weight="${dom ? 700 : 500}">${v}%</tspan></text>`;
  }).join('');
  const dots = order.map((k, i) => { const [x, y] = pt(i, val(R.sc, k)); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#fff" stroke="${col(k)}" stroke-width="2.5"/>`; }).join('');
  return `<svg viewBox="0 0 380 380" role="img" aria-label="Радар: вираженість восьми полюсів MBTI">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8bd0"/><stop offset=".5" stop-color="#9d8bff"/><stop offset="1" stop-color="#4fe3ff"/></linearGradient>
    <filter id="rglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g style="color:var(--ink)">${rings}${spokes}</g>
    <polygon points="${poly(R.ss)}" fill="none" stroke="#ff8bd0" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" opacity=".9"/>
    <polygon points="${poly(R.sf)}" fill="none" stroke="#4fe3ff" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
    <polygon points="${poly(R.sc)}" fill="url(#rg)" fill-opacity=".38" stroke="url(#rg)" stroke-width="3" stroke-linejoin="round" filter="url(#rglow)"/>
    ${dots}<g style="color:var(--ink)">${labels}</g></svg>`;
}
function compareHTML(R) {
  const rows = AXES.map(ax => {
    const pS = pctOf(R.ss.ax[ax.id]), pF = pctOf(R.sf.ax[ax.id]);
    const sD = pS > 50 ? ax.a : ax.b, fD = pF > 50 ? ax.a : ax.b;
    const sP = pS > 50 ? pS : 100 - pS, fP = pF > 50 ? pF : 100 - pF;
    const d = Math.abs(pS - pF), differ = sD !== fD;
    if (!differ && d < 15) return { d, same: true, html: `<div class="gap same"><b>${ax.title}</b>: думки збігаються — ${sD.name} (${sP}% / ${fP}%).</div>` };
    const more = pF > pS ? ax.a : ax.b;
    return { d, same: false, html: `<div class="gap"><b>${ax.title}</b>: самооцінка — ${sD.name} ${sP}%, друг бачить — ${fD.name} ${fP}%. Друг помічає більше ${more.gen}, ніж людина про себе думає.</div>` };
  });
  const mean = AXES.reduce((n, ax) => n + Math.abs(pctOf(R.ss.ax[ax.id]) - pctOf(R.sf.ax[ax.id])), 0) / AXES.length;
  const close = Math.max(0, Math.round(100 - mean));
  const match = [...R.tS.code].filter((c, i) => c === R.tF.code[i]).length + (R.tS.id === R.tF.id ? 1 : 0);
  const sorted = rows.slice().sort((x, y) => y.d - x.d);
  return { close, match, mean: Math.round(mean), html: sorted.map(r => r.html).join('') };
}
function stackHTML(R) {
  const g = GROUPS[groupOf(R.t.code)];
  return STACK[R.t.code].split(' ').map((f, i) => `<div class="fn" style="--c1:${g.c};--c2:#fff"><small>${STACK_ROLES[i][0]}</small><div class="code">${f}</div><b>${FN[f].n}</b><p>${FN[f].d}</p></div>`).join('');
}
function facetsHTML(R) {
  return AXES.map(ax => `<div class="fgroup" style="--c1:${ax.c1};--c2:${ax.c2}"><h3><i></i>${ax.title} · ${ax.a.k}/${ax.b.k}</h3>` +
    FACETS.filter(f => f.axis === ax.id).map(f => {
      const p = pctOf(R.sc.fc[f.id]);
      return `<div class="facet" style="--v:${p}%"><div class="fname">${f.name}</div><div class="a ${p >= 50 ? 'dom' : ''}">${f.a}</div><div class="fbar"><i></i><b></b></div><div class="${p < 50 ? 'dom' : ''}">${f.b}</div></div>`;
    }).join('') + `</div>`).join('');
}
function bodyHTML(R) {
  const info = TYPES[R.t.code], cmp = compareHTML(R);
  const ring = (v, c1, label, small) => `<div class="ring" style="--v:${v};--c1:${c1}"><div><b>${label}</b><small>${small}</small></div></div>`;
  const border = AXES.slice(0, 4).filter(ax => Math.abs(R.sc.ax[ax.id]) < 0.2).map(ax => `${ax.a.name} / ${ax.b.name} (${pctOf(R.sc.ax[ax.id])}% / ${100 - pctOf(R.sc.ax[ax.id])}%)`);
  return `<div class="grid">
    <div class="span7 col">${AXES.map((ax, i) => axisCard(ax, R, i)).join('')}</div>
    <div class="span5 col">
      <div class="glass card rv"><h2>Радар полюсів</h2><p class="sub">Чим далі від центра, тим сильніше виражений полюс.</p>
        <div class="radar-wrap">${radarSVG(R)}</div>
        <div class="legend"><span><i style="border-color:#9d8bff"></i>разом</span><span><i style="border-color:#ff8bd0;border-top-style:dashed"></i>самооцінка</span><span><i style="border-color:#4fe3ff;border-top-style:dotted"></i>друг</span></div></div>
      <div class="glass card rv"><h2>Два погляди</h2><p class="sub">Наскільки збігається те, як людина бачить себе, і те, як її бачить друг.</p>
        <div class="ring-row" style="margin-top:14px">${ring(cmp.close, '#4ade80', cmp.close + '%', 'близькість')}
          <div class="ring-txt"><b>${cmp.match} з 5</b> літер типу збігаються<br><span class="muted">Середня різниця по шкалах — ${cmp.mean} п.п.</span></div></div>
        <div class="gap-list">${cmp.html}</div></div>
    </div>
    <div class="span7"><div class="glass card rv"><h2>Усі грані характеру</h2><p class="sub">Дрібніші шкали всередині кожної осі (разом з урахуванням обраної ваги думок).</p>
      <div class="facets" style="margin-top:16px">${facetsHTML(R)}</div></div></div>
    <div class="span5 col">
      <div class="glass card rv"><h2>Когнітивні функції</h2><p class="sub">Типовий «стек» для ${R.t.code}: від найсильнішої до найслабшої.</p>
        <div class="stack4" style="margin-top:14px">${stackHTML(R)}</div></div>
      ${border.length ? `<div class="glass card rv"><h2>Межові шкали</h2><p class="sub">Тут результат майже порівну — тип може «гойдатися» залежно від ситуації.</p>
        <div class="gap-list">${border.map(b => `<div class="gap">${b}</div>`).join('')}</div></div>` : ''}
    </div>
    <div class="span12"><div class="glass card rv"><h2>${R.t.code} · ${info.n}</h2>
      <p class="para" style="margin:6px 0 16px">${info.d}</p>
      <div class="lists"><div><h3>Сильні сторони</h3><ul>${info.pro.map(x => `<li>${x}</li>`).join('')}</ul></div>
        <div class="bad"><h3>На що звернути увагу</h3><ul>${info.con.map(x => `<li>${x}</li>`).join('')}</ul></div></div>
      <h3 style="margin:18px 0 6px;font-size:.95rem">Як такий тип дружить</h3><p class="para">${info.fr}</p></div></div>
  </div>`;
}
function viewResult() {
  const w = S.w;
  return `<section class="wrap wide">
    <div class="topbar"><button class="btn small ghost" data-act="home">← На головну</button><span class="chip">${S.mode === 'room' ? 'Кімната ' + fmtCode(S.code) : 'Один пристрій'}</span></div>
    <div id="res-hero"></div>
    <div class="glass slider-box rv" id="res-ctl">
      <div class="axis-head" style="margin-bottom:2px"><span>Вага думок</span><span id="wtxt" style="text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:500"></span></div>
      <div id="res-views"></div>
      <input class="range" id="wrange" type="range" min="0" max="100" step="1" value="${Math.round(w * 100)}" data-bind="w" aria-label="Співвідношення самооцінки та погляду друга">
      <div class="range-cap"><span>Як людина бачить себе</span><span>Як бачить друг</span></div>
    </div>
    <div id="res-body"></div>
    <div class="row grow" style="justify-content:center;margin-top:6px">
      <button class="btn primary" data-act="copyResult">Скопіювати результат</button>
      <button class="btn" data-act="discard">Пройти ще раз</button>
    </div>
    <p class="fine center">Це розважальний тест на основі самооцінки та оцінки друга — не психологічна діагностика.</p>
  </section>`;
}
let revealIO = null;
function reveal(root, immediate) {
  const els = root.querySelectorAll('.rv:not(.in)');
  if (immediate || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  if (!revealIO) revealIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); revealIO.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px' });
  els.forEach(e => revealIO.observe(e));
}
function paintResult(animate) {
  if (!$('res-body')) return;
  const R = computeResult(S.w);
  $('res-hero').innerHTML = heroHTML(R);
  $('res-body').innerHTML = bodyHTML(R);
  paintControls();
  reveal(app, !animate);
}
function paintControls() {
  const w = S.w, pf = Math.round(w * 100);
  $('res-views').innerHTML = controlsInner(w);
  $('wtxt').textContent = pf === 0 ? 'тільки самооцінка' : pf === 100 ? 'тільки погляд друга' : `самооцінка ${100 - pf}% · друг ${pf}%`;
  $('wrange').value = pf;
}
function summaryText() {
  const R = computeResult(S.w), n = targetName();
  return [`Дзеркало MBTI${n ? ' — ' + n : ''}`, `${R.t.full} · ${TYPES[R.t.code].n}`,
    AXES.map(ax => { const po = pole(ax, R.sc.ax[ax.id]); return `${po.p.k} ${po.pct}%`; }).join(' · '),
    `Самооцінка: ${R.tS.full} · Погляд друга: ${R.tF.full}`].join('\n');
}

/* ═════════════ НАВІГАЦІЯ ═════════════ */
const VIEWS = { home: viewHome, local: viewLocal, pass: viewPass, lobby: viewLobby, quiz: viewQuiz, wait: viewWait, questions: viewQuestions, result: viewResult };
const AFTER = {
  lobby: paintLobby, quiz: () => paintQuiz(false), wait: paintWait,
  result: () => paintResult(true),
  home: () => { if (INVITE && $('joinCode')) $('joinCode').scrollIntoView({ block: 'center' }); },
};
function go(s) { if (s === 'questions') prevScreen = screen; screen = s; render(); }
function render() {
  app.innerHTML = VIEWS[screen]();
  window.scrollTo({ top: 0, behavior: 'instant' });
  if (AFTER[screen]) AFTER[screen]();
}
function refreshDynamic() {
  if (screen === 'lobby') paintLobby();
  else if (screen === 'wait') paintWait();
}
function onPeerChange() {
  if (screen === 'wait' && bothDone()) { go('result'); return; }
  if (screen === 'result' && bothDone()) { paintResult(false); return; }
  refreshDynamic();
}
function newSession(mode) {
  netClose(); P = null;
  const keep = { cid: S.cid, name: S.name };
  S = Object.assign(blank(), keep); S.mode = mode; homeErr = ''; save();
}
function resumeScreen() {
  if (S.mode === 'local') {
    if (bothDone()) return 'result';
    return S.done.self ? 'pass' : null;
  }
  if (bothDone()) return 'result';
  if (S.role && S.done[S.role]) return 'wait';
  return 'lobby';
}

/* ═════════════ ДІЇ ═════════════ */
const ACT = {
  create() { INVITE = ''; newSession('room'); S.code = rid(CODE_LEN); save(); netConnect(S.code, 'create'); go('lobby'); },
  local() { newSession('local'); go('local'); },
  lpron(el) { S.pron = el.dataset.v; save(); el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); },
  home() { netClose(); homeErr = ''; go('home'); },
  discard() { netClose(); P = null; try { localStorage.removeItem(KEY); } catch (e) {} S = blank(); homeErr = ''; go('home'); },
  resume() {
    homeErr = '';
    if (S.mode === 'room') netConnect(S.code, 'resume');
    const next = resumeScreen();
    if (next) return go(next);
    S.turn = 'self'; startQuiz('self');
  },
  retry() { if (S.code) netConnect(S.code, 'resume'); refreshDynamic(); },
  copyCode() { copyText(S.code ? fmtCode(S.code) : '', 'Код скопійовано'); },
  async share() {
    const url = shareUrl();
    if (navigator.share) { try { await navigator.share({ title: 'Дзеркало MBTI', text: 'Приєднуйся до моєї кімнати: ' + fmtCode(S.code), url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    copyText(url, 'Посилання скопійовано');
  },
  role(el) {
    S.role = el.dataset.v; save(); netPush(0); paintLobby();
  },
  pron(el) { S.pron = el.dataset.v; save(); netPush(0); paintLobby(); },
  start() {
    if (!S.role) return;
    if (S.done[S.role]) { go(bothDone() ? 'result' : 'wait'); return; }
    startQuiz(S.role);
  },
  startFriend() { S.turn = 'friend'; save(); startQuiz('friend'); },
  exitQuiz() {
    if (S.mode === 'room') { netPush(0); go('lobby'); } else { go('home'); }
  },
  prev() { if (Q && Q.pos > 0) { Q.pos--; Q.dir = 'b'; paintQuiz(true); } },
  ans(el) { answer(+el.dataset.v); },
  questions() { go('questions'); },
  backFromQ() { go(prevScreen === 'questions' ? 'home' : prevScreen); },
  toLobby() { go('lobby'); },
  tab(el) { S.w = +el.dataset.v; save(); paintResult(false); },
  copyResult() { copyText(summaryText(), 'Результат скопійовано'); },
};
const BIND = {
  name(v) {
    S.name = v.slice(0, 24); save(); netPush(900);
    if (screen === 'lobby') $('lb-people').innerHTML = personRow({ name: S.name, role: S.role, done: S.role ? S.done[S.role] : false, count: S.role ? cnt(S.ans[S.role]) : 0 }, true) + personRow(P, false);
  },
  w(v) {
    S.w = Math.max(0, Math.min(1, +v / 100));
    cancelAnimationFrame(BIND.raf);
    BIND.raf = requestAnimationFrame(() => { save(); paintResult(false); });
  },
};
const FORM = {
  join(f) {
    const code = normCode(f.code.value);
    if (code.length !== CODE_LEN) { $('homeErr').textContent = 'Код складається з 6 символів, наприклад ABC-123.'; return; }
    newSession('room'); S.code = code; save(); netConnect(code, 'join'); go('lobby');
    INVITE = '';
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  },
  local(f) {
    const name = f.name.value.trim().slice(0, 24);
    if (!S.pron) { $('localErr').textContent = 'Обери «вона» або «він» — так питання для друга звучатимуть природно.'; return; }
    S.name = name; S.turn = 'self'; save(); startQuiz('self');
  },
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'A') e.preventDefault();
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
app.addEventListener('input', e => { const b = e.target.dataset && e.target.dataset.bind; if (b && BIND[b]) BIND[b](e.target.value, e.target); });
app.addEventListener('submit', e => { e.preventDefault(); const f = e.target.dataset.form; if (f && FORM[f]) FORM[f](e.target); });
document.addEventListener('keydown', e => {
  if (screen !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (/^[1-7]$/.test(e.key)) { e.preventDefault(); answer(+e.key - 4); }
  else if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); ACT.prev(); }
});
document.addEventListener('pointermove', e => {
  const g = e.target.closest && e.target.closest('.glass'); if (!g) return;
  const r = g.getBoundingClientRect();
  g.style.setProperty('--mx', (e.clientX - r.left) + 'px'); g.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });

render();
</script>
</body>
</html>
